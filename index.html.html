<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub用户查询平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) fixed; color: #333; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 3rem 1rem; color: white; }
        header h1 { font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        header p { font-size: 1.2rem; opacity: 0.9; max-width: 600px; margin: 0 auto; }
        .main-area { display: grid; grid-template-columns: 1fr 350px; gap: 30px; margin-top: 20px; }
        @media (max-width: 900px) { .main-area { grid-template-columns: 1fr; } }
        .left-panel { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); }
        .search-box { display: flex; margin-bottom: 30px; }
        .search-box input {
            flex-grow: 1; padding: 18px 25px; border: 2px solid #e1e4e8; border-radius: 50px 0 0 50px; font-size: 1.1rem; transition: all 0.3s;
        }
        .search-box input:focus { outline: none; border-color: #667eea; }
        .search-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 0 40px;
            border-radius: 0 50px 50px 0; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: opacity 0.3s;
        }
        .search-box button:hover { opacity: 0.9; }
        .user-card {
            background: #f9fafc; border-radius: 15px; padding: 25px; margin-bottom: 30px; border-left: 5px solid #667eea; display: none;
        }
        .user-card.active { display: block; }
        .user-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .user-avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #e1e4e8; }
        .user-info h2 { margin-bottom: 5px; color: #24292e; }
        .user-info h2 a { color: inherit; text-decoration: none; }
        .user-info h2 a:hover { text-decoration: underline; }
        .user-bio { color: #57606a; line-height: 1.5; margin-bottom: 15px; }
        .user-stats { display: flex; gap: 20px; }
        .stat { text-align: center; }
        .stat-number { display: block; font-size: 1.5rem; font-weight: bold; color: #24292e; }
        .stat-label { font-size: 0.9rem; color: #57606a; }
        .repo-list-title { margin: 30px 0 15px; color: #24292e; }
        .repo-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .repo-card {
            background: white; border: 1px solid #e1e4e8; border-radius: 10px; padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .repo-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); }
        .repo-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .repo-name a { color: #0969da; text-decoration: none; }
        .repo-name a:hover { text-decoration: underline; }
        .repo-description { color: #57606a; font-size: 0.95rem; margin-bottom: 15px; line-height: 1.4; }
        .repo-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: #8b949e; }
        .history-panel {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); height: fit-content;
        }
        .history-panel h3 { margin-bottom: 20px; color: #24292e; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        .history-list { list-style: none; }
        .history-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer;
        }
        .history-item:hover { background-color: #f8f9fa; }
        .history-item:last-child { border-bottom: none; }
        .history-avatar { width: 40px; height: 40px; border-radius: 50%; }
        .history-info { flex-grow: 1; }
        .history-name { font-weight: bold; color: #24292e; }
        .history-bio { font-size: 0.85rem; color: #666; margin-top: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .history-time { font-size: 0.8rem; color: #8b949e; }
        .query-badge { background: #e1e4e8; color: #57606a; font-size: 0.75rem; padding: 2px 6px; border-radius: 10px; margin-left: 8px; }
        .loading, .error, .empty { text-align: center; padding: 40px 20px; color: #57606a; grid-column: 1 / -1; }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-github"></i> GitHub用户探索平台</h1>
            <p>输入任何GitHub用户名，查看他的公开仓库、信息和动态。你的每次探索都会被记录。</p>
        </header>
        <div class="main-area">
            <div class="left-panel">
                <div class="search-box">
                    <input type="text" id="usernameInput" placeholder="输入GitHub用户名，例如: facebook, vuejs, laddzhao">
                    <button onclick="searchUser()"><i class="fas fa-search"></i> 探索</button>
                </div>
                <div id="userCard" class="user-card"></div>
                <h3 class="repo-list-title" id="repoTitle" style="display:none;">公开仓库</h3>
                <div class="repo-list" id="repoListContainer">
                    <div class="empty">
                        <i class="fas fa-search" style="font-size:3rem; color:#e1e4e8; margin-bottom:15px;"></i>
                        <p>输入用户名并点击“探索”，结果将在这里展示。</p>
                    </div>
                </div>
            </div>
            <aside class="history-panel">
                <h3><i class="fas fa-history"></i> 最近查询</h3>
                <ul class="history-list" id="queryHistory">
                    <li class="empty">暂无查询记录。</li>
                </ul>
            </aside>
        </div>
    </div>

    <!-- 关键：先引入Supabase库 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- 然后使用该库的自定义脚本 -->
    <script>
        // 配置（已填写你的信息）
        const SUPABASE_URL = 'https://owkwfqshenefojjtyqrz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xUViVaFEZYsttY7dGSU6-w_XjTC_5df';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 主搜索函数 - 已修复更新逻辑
        async function searchUser() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) { alert('请输入一个GitHub用户名'); return; }
            console.log(`[Debug] 开始搜索用户: ${username}`);

            document.getElementById('userCard').classList.remove('active');
            document.getElementById('repoListContainer').innerHTML = '<div class="loading"><div class="spinner"></div><p>正在从GitHub获取数据...</p></div>';
            document.getElementById('repoTitle').style.display = 'none';

            try {
                const [userResponse, reposResponse] = await Promise.all([
                    fetch(`https://api.github.com/users/${username}`),
                    fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`)
                ]);
                if (!userResponse.ok) throw new Error(`用户"${username}"未找到或无法访问。`);
                if (!reposResponse.ok) throw new Error('无法获取仓库列表。');
                const userData = await userResponse.json();
                const reposData = await reposResponse.json();
                console.log(`[Debug] GitHub数据获取成功`);

                // --- 核心修复：智能更新或插入记录 ---
                console.log(`[Debug] 检查数据库记录...`);
                const { data: existingRecord, error: selectError } = await supabaseClient
                    .from('github_query_history')
                    .select('id, query_count')
                    .eq('username', username)
                    .maybeSingle();

                if (selectError) {
                    console.error('[Debug] 查询记录失败:', selectError);
                }

                if (existingRecord && existingRecord.id) {
                    // 用户已存在 -> 更新查询次数
                    const newCount = (existingRecord.query_count || 0) + 1;
                    console.log(`[Debug] 用户存在，准备更新。旧次数: ${existingRecord.query_count}, 新次数: ${newCount}`);
                    const { error: updateError } = await supabaseClient
                        .from('github_query_history')
                        .update({
                            query_count: newCount,
                            last_searched_at: new Date().toISOString(),
                            avatar_url: userData.avatar_url,
                            user_bio: userData.bio,
                            public_repos: userData.public_repos
                        })
                        .eq('id', existingRecord.id);
                    if (updateError) {
                        console.error('[Debug] 更新记录失败:', updateError);
                    } else {
                        console.log('[Debug] 更新记录成功');
                    }
                } else {
                    // 用户不存在 -> 插入新记录
                    console.log(`[Debug] 用户不存在，准备插入新记录`);
                    const { error: insertError } = await supabaseClient
                        .from('github_query_history')
                        .insert([{
                            username: username,
                            avatar_url: userData.avatar_url,
                            user_bio: userData.bio,
                            public_repos: userData.public_repos,
                            query_count: 1,
                            last_searched_at: new Date().toISOString()
                        }]);
                    if (insertError) {
                        console.error('[Debug] 插入记录失败:', insertError);
                    } else {
                        console.log('[Debug] 插入记录成功');
                    }
                }
                // --- 核心修复结束 ---

                renderUserCard(userData);
                renderRepoList(reposData);
                loadQueryHistory();

            } catch (error) {
                console.error('[Debug] 搜索失败:', error);
                document.getElementById('repoListContainer').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#f0c929; margin-bottom:15px;"></i>
                        <p><strong>查询失败</strong></p>
                        <p>${error.message}</p>
                        <p><small>详细错误已打印到控制台 (按F12查看)。</small></p>
                    </div>
                `;
            }
        }

        function renderUserCard(user) {
            const card = document.getElementById('userCard');
            card.innerHTML = `
                <div class="user-header">
                    <img src="${user.avatar_url}" alt="${user.login}" class="user-avatar">
                    <div class="user-info">
                        <h2><a href="${user.html_url}" target="_blank">${user.name || user.login}</a></h2>
                        <p class="user-login">@${user.login}</p>
                        <p class="user-bio">${user.bio || '该用户暂无简介。'}</p>
                    </div>
                </div>
                <div class="user-stats">
                    <div class="stat"><span class="stat-number">${user.public_repos}</span><span class="stat-label">仓库</span></div>
                    <div class="stat"><span class="stat-number">${user.followers}</span><span class="stat-label">关注者</span></div>
                    <div class="stat"><span class="stat-number">${user.following}</span><span class="stat-label">正在关注</span></div>
                </div>`;
            card.classList.add('active');
        }

        function renderRepoList(repos) {
            const container = document.getElementById('repoListContainer');
            const title = document.getElementById('repoTitle');
            if (!repos || repos.length === 0) {
                container.innerHTML = '<div class="empty"><p>该用户暂无公开仓库。</p></div>';
                title.style.display = 'none';
                return;
            }
            title.style.display = 'block';
            const reposHTML = repos.map(repo => `
                <div class="repo-card">
                    <h4 class="repo-name"><a href="${repo.html_url}" target="_blank"><i class="far fa-folder-open"></i> ${repo.name}</a></h4>
                    <p class="repo-description">${repo.description || '暂无描述'}</p>
                    <div class="repo-meta">
                        <span><i class="fas fa-star" style="color:#f0c929;"></i> ${repo.stargazers_count}</span>
                        <span><i class="fas fa-code-branch" style="color:#8b949e;"></i> ${repo.forks_count}</span>
                        <span><i class="fas fa-circle" style="color:${getLanguageColor(repo.language)};"></i> ${repo.language || 'N/A'}</span>
                        <span title="最后更新"><i class="far fa-clock"></i> ${formatDate(repo.updated_at)}</span>
                    </div>
                </div>`).join('');
            container.innerHTML = reposHTML;
        }

        async function loadQueryHistory() {
            const historyList = document.getElementById('queryHistory');
            const { data, error } = await supabaseClient
                .from('github_query_history')
                .select('username, avatar_url, user_bio, query_count, last_searched_at')
                .order('last_searched_at', { ascending: false })
                .limit(10);
            if (error) { console.error('加载历史记录失败:', error); return; }
            if (!data || data.length === 0) { historyList.innerHTML = '<li class="empty">暂无查询记录。</li>'; return; }
            const historyHTML = data.map(item => `
                <li class="history-item" onclick="fillSearchBox('${item.username}')">
                    <img src="${item.avatar_url || 'https://avatars.githubusercontent.com/u/583231?v=4'}" alt="${item.username}" class="history-avatar">
                    <div class="history-info">
                        <div class="history-name">
                            ${item.username}
                            <span class="query-badge">查过 ${item.query_count || 1} 次</span>
                        </div>
                        <div class="history-bio">${item.user_bio || '暂无简介'}</div>
                        <div class="history-time">${formatTimeAgo(item.last_searched_at)}</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color:#8b949e;"></i>
                </li>`).join('');
            historyList.innerHTML = historyHTML;
        }

        function fillSearchBox(username) {
            document.getElementById('usernameInput').value = username;
            searchUser();
        }

        function getLanguageColor(lang) {
            const colors = {
                'JavaScript': '#f1e05a', 'Python': '#3572A5', 'Java': '#b07219',
                'TypeScript': '#2b7489', 'HTML': '#e34c26', 'CSS': '#563d7c',
                'Vue': '#41b883', 'Go': '#00ADD8'
            };
            return colors[lang] || '#8b949e';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '昨天';
            if (diffDays < 30) return `${diffDays} 天前`;
            if (diffDays < 365) return `${Math.floor(diffDays / 30)} 个月前`;
            return date.toLocaleDateString('zh-CN');
        }

        function formatTimeAgo(dateString) {
            return formatDate(dateString);
        }

        document.addEventListener('DOMContentLoaded', loadQueryHistory);
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchUser();
        });
    </script>
</body>
</html>
